<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>型番商品確認くん</title>
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=0.14.2">
</head>
<body>

<header class="app-header">

  <!-- 1段目: ブランド + リポジトリ + 操作 -->
  <div class="head-row head-brand">
    <div class="brand">
      <span class="brand-icon"><img src="favicon.png" alt="" width="64" height="64"></span>
      <img class="brand-logo" src="logo.png?v=2" alt="型番商品確認くん" width="746" height="96">
    </div>
    <div class="head-actions">
      <span class="repo-badge" id="repoBadge" title="保存先リポジトリ">未設定</span>
      <span class="ver-badge" id="verLabel">v0.14.2</span>
      <span class="dirty-badge" id="saveState" hidden>● 未保存</span>
      <button class="btn btn-primary btn-sm" id="btnSaveGh">💾 保存</button>
      <button class="btn btn-ghost btn-sm" id="btnSettings">⚙️ 設定</button>
    </div>
  </div>

  <!-- 2段目: グローバルメニュー -->
  <nav class="gnav" id="gnav"></nav>

  <!-- 3段目: ツールバー -->
  <div class="head-row head-tools">
    <div class="search-wrap">
      <input type="search" id="q" class="search" placeholder="検索…" autocomplete="off">
      <button class="search-clear" id="qClear" title="クリア">✕</button>
    </div>
    <div class="seg" id="catSeg"></div>
    <span class="count" id="countLabel"></span>
    <button class="btn btn-ghost btn-sm" id="btnCols" title="列幅と行の高さを調整">⇔ 幅・高さ調整</button>
    <button class="btn btn-ghost btn-sm" id="btnEditMode" title="表の中で直接編集する">✎ 表編集</button>
    <button class="btn btn-add btn-sm" id="btnNew">＋ 追加</button>
  </div>

  <!-- 列幅パネル -->
  <div class="col-panel" id="colPanel" hidden>
    <div class="col-panel-in">
      <span class="col-panel-ttl">幅・高さ</span>
      <div class="col-panel-body" id="colPanelBody"></div>
      <button class="btn btn-ghost btn-sm" id="btnColsReset">既定に戻す</button>
      <span class="hint col-panel-hint">列の境目をドラッグしても変えられます（境目をダブルクリックで既定に戻る）</span>
    </div>
  </div>

</header>

<main class="container">
  <div class="list" id="list"></div>
  <div class="empty" id="emptyState" hidden>
    <p class="empty-ttl" id="emptyTtl"></p>
    <p class="empty-sub" id="emptySub"></p>
  </div>
</main>

<!-- ===== 編集モーダル ===== -->
<div class="modal-overlay" id="rankModal" hidden>
  <div class="modal modal-wide">
    <div class="modal-head">
      <h2 class="modal-ttl" id="rankModalTtl">ランキングURLを追加</h2>
      <button class="icon-btn" id="rankClose" title="閉じる">✕</button>
    </div>

    <div class="modal-body">
      <div class="rank-grid">

        <!-- 左：アイキャッチ画像 -->
        <div class="rank-col-img">
          <label for="rImage">アイキャッチ画像</label>
          <div class="img-box" id="rImagePrev"></div>
          <input id="rImage" type="url" placeholder="画像URL（任意）">
          <button class="btn btn-ghost btn-sm img-fetch" id="btnFetchImg" type="button">URLから取得</button>
          <p class="hint">AmazonのURL（/dp/…）なら自動取得できます。それ以外は商品ページの画像を右クリック →「画像アドレスをコピー」で貼ってください。</p>
        </div>

        <!-- 右：その他の項目 -->
        <div class="rank-col-fields">
          <div class="field">
            <label for="rName"><span id="rNameLabel">ジャンル名</span> <span class="req">*</span></label>
            <input id="rName" type="text" placeholder="例) 家電 > 扇風機・サーキュレーター / SD-1200X 電動キックボード">
          </div>
          <div class="field">
            <label for="rUrl">URL <span class="req">*</span></label>
            <input id="rUrl" type="url" placeholder="https://…">
          </div>
          <div class="field">
            <label for="rNote">確認内容</label>
            <textarea id="rNote" rows="3" placeholder="何を見るか・気づいたこと（例：上位の価格帯が下がってきている）"></textarea>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="rCat">カテゴリ</label>
              <input id="rCat" type="text" list="rankCatList" placeholder="未分類">
              <datalist id="rankCatList"></datalist>
            </div>
            <div class="field">
              <label for="rChecked">最終確認日</label>
              <div class="date-row">
                <input id="rChecked" type="date">
                <button class="btn btn-ghost btn-sm" id="btnToday" type="button">本日反映</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 下：追加した商品 -->
      <section class="modal-picks">
        <h3 class="sec-ttl">追加した商品 <span class="sec-sub" id="rPickCnt"></span></h3>
        <div id="rPickList"></div>
      </section>
    </div>

    <div class="modal-foot">
      <button class="btn btn-ghost btn-danger" id="btnDelRank">削除</button>
      <div class="grow"></div>
      <button class="btn btn-ghost" id="btnCancelRank">キャンセル</button>
      <button class="btn btn-primary" id="btnSaveRank">保存</button>
    </div>
  </div>
</div>

<!-- ===== 設定モーダル ===== -->
<div class="modal-overlay" id="cfgModal" hidden>
  <div class="modal">
    <div class="modal-head">
      <h2 class="modal-ttl">設定</h2>
      <button class="icon-btn" id="cfgClose" title="閉じる">✕</button>
    </div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field">
          <label for="cOwner">オーナー</label>
          <input id="cOwner" type="text" placeholder="kaiyoshida0318">
        </div>
        <div class="field">
          <label for="cRepo">リポジトリ</label>
          <input id="cRepo" type="text" placeholder="kataban-kakunin">
        </div>
        <div class="field w-sm">
          <label for="cBranch">ブランチ</label>
          <input id="cBranch" type="text" placeholder="main">
        </div>
      </div>
      <div class="field">
        <label for="cPat">Personal Access Token</label>
        <input id="cPat" type="password" placeholder="github_pat_…" autocomplete="off">
        <p class="hint">Contents の Read and write 権限が必要です。この端末のブラウザ内にのみ保存されます。</p>
      </div>
      <div class="cfg-actions">
        <button class="btn btn-ghost" id="btnPullGh">⤓ GitHubから読み込む</button>
        <button class="btn btn-ghost" id="btnTestGh">接続テスト</button>
        <span class="hint" id="cfgStatus"></span>
      </div>
      <p class="hint">問い合わせ先：<a id="cfgUrl" class="cfg-url" target="_blank" rel="noopener noreferrer"></a></p>
    </div>
    <div class="modal-foot">
      <div class="grow"></div>
      <button class="btn btn-primary" id="btnSaveCfg">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js?v=0.14.2"></script>
</body>
</html>
